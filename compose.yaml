services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-restaurant}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-restaurant}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # الكوكيز لازم تكون secure بـdefault. التطبيق بيرفض يقلع في production
      # لو الكوكيز مش secure، فالتغيير هنا مقصود: أي نشر على HTTP لازم
      # يكون صريح بـCOOKIE_SECURE=false في .env
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # يبقى فاضي أو "*" بس لو التطبيق مكشوف مباشرة ورا proxy ما فيش
      # حاجة تانية وراه — غير كده حط IP الـproxy أو شبكته.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - restaurant_uploads:/app/app/uploads
    # /ready مش /health: الـliveness مش بيتكلم مع الداتابيز، والـreadiness
    # بي.accessها. ده اللي يخلي الـcontainer يتشال من الـload balancer
    # لما الـDB تبطّ.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  restaurant_uploads:
