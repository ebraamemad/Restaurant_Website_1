<div class="mb-4 sm:mb-6">

    <div class="flex gap-2 overflow-x-auto pb-2 sm:gap-3">

        {% for category in categories %}

        <a
            href="#cat-{{ category.id }}"
            class="chip-scroll shrink-0 whitespace-nowrap rounded-full bg-white px-3 py-2 text-sm font-semibold shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-primary hover:text-white active:scale-[0.98] sm:px-5 sm:text-base">

            {{ category.name }}

        </a>

        {% endfor %}

    </div>

</div>
