<div class="mb-6 sm:mb-8">

    <div class="section-heading">
        <div>
            <p class="eyebrow">اختار وجبتك</p>
            <h2>تصفّح القائمة</h2>
        </div>
        <span class="hidden text-sm text-slate-500 sm:block">كل ما تحبه في مكان واحد</span>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-3 -mx-1 px-1 sm:gap-3 sm:pb-4 sm:mx-0 sm:px-0">

        {% for category in categories %}

        <a
            href="#cat-{{ category.id }}"
            class="chip-scroll flex shrink-0 items-center gap-2 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm font-bold text-slate-700 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-primary hover:text-white hover:shadow-md active:scale-[0.98] sm:px-4 sm:py-3 sm:text-base">

            {% if category.image_url %}

            <img
                src="{{ category.image_url }}"
                alt=""
                class="h-7 w-7 rounded-full object-cover"
                loading="lazy"
                decoding="async">

            {% else %}

            <span class="text-base sm:text-lg" aria-hidden="true">🍽</span>

            {% endif %}

            {{ category.name }}

            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-bold text-slate-500 group-hover:bg-white/20 group-hover:text-white">{{ category.products | length }}</span>

        </a>

        {% endfor %}

    </div>

</div>
