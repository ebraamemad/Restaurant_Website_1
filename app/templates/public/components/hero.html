<section class="relative overflow-hidden bg-gradient-to-r from-primary via-emerald-600 to-emerald-700 text-white">

    {% if settings.banner_url %}

    <img
        src="{{ settings.banner_url }}"
        class="absolute inset-0 h-full w-full object-cover opacity-25">

    {% endif %}

    <div class="relative section px-3 py-8 sm:px-4 sm:py-10 lg:py-16">

        <div class="flex flex-col items-center text-center">

            {% if settings.logo_url %}

            <img
                src="{{ settings.logo_url }}"
                class="h-20 w-20 rounded-full border-4 border-white object-cover shadow-2xl sm:h-24 sm:w-24 lg:h-32 lg:w-32"
                loading="lazy"
                decoding="async">

            {% endif %}

            <h1 class="mt-4 text-[1.45rem] font-extrabold leading-tight sm:text-3xl lg:text-4xl">

                {{ settings.store_name }}

            </h1>

            {% if settings.address %}

            <p class="mt-3 text-sm opacity-90 sm:text-base lg:text-lg">

                📍 {{ settings.address }}

            </p>

            {% endif %}

            {% if settings.working_hours %}

            <p class="mt-2 text-sm opacity-80 sm:text-base">

                🕒 {{ settings.working_hours }}

            </p>

            {% endif %}

        </div>

    </div>

</section>
