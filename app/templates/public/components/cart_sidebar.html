<aside class="card sticky top-5 hidden h-fit lg:block">

    <div class="border-b p-5">

        <h2 class="text-xl font-bold">
            🛒 سلة الطلب
        </h2>

    </div>

    <div class="max-h-[420px] overflow-auto p-5">

        <template x-if="items.length === 0">

            <div class="py-10 text-center text-slate-400">
                السلة فارغة
            </div>

        </template>

        <template x-for="item in items" :key="item.lineId">

            <div class="mb-4 border-b pb-4">

                <div class="flex justify-between gap-3">

                    <div class="flex-1">

                        <div class="font-bold" x-text="item.name"></div>

                        <template x-if="item.options && item.options.length > 0">
                            <div class="mt-1 text-xs text-slate-500">
                                <template x-for="opt in item.options" :key="opt.id">
                                    <div>• <span x-text="opt.name"></span> (+<span x-text="formatPrice(opt.price_adjustment)"></span>)</div>
                                </template>
                            </div>
                        </template>

                        <template x-if="item.addons && item.addons.length > 0">
                            <div class="mt-1 text-xs text-slate-500">
                                <template x-for="addon in item.addons" :key="addon.id">
                                    <div>+ <span x-text="addon.name"></span> (<span x-text="formatPrice(addon.price)"></span>)</div>
                                </template>
                            </div>
                        </template>

                        <template x-if="item.item_note">
                            <div class="mt-1 text-xs text-amber-700">📝 <span x-text="item.item_note"></span></div>
                        </template>

                        <div class="mt-1 font-semibold text-primary" x-text="formatPrice(lineTotal(item))"></div>

                    </div>

                    <button
                        @click="remove(item.lineId)"
                        class="text-lg text-red-500"
                        aria-label="حذف">
                        🗑
                    </button>

                </div>

                <div class="mt-3 flex items-center gap-2">

                    <button
                        class="h-8 w-8 rounded bg-slate-200 font-bold"
                        @click="decreaseQty(item)">
                        −
                    </button>

                    <input
                        x-model.number="item.quantity"
                        @change="setQty(item, item.quantity)"
                        type="number"
                        min="1"
                        max="999"
                        step="1"
                        class="w-16 rounded border text-center">

                    <button
                        class="h-8 w-8 rounded bg-slate-200 font-bold"
                        @click="increaseQty(item)">
                        +
                    </button>

                </div>

            </div>

        </template>

    </div>

    {% include "public/components/checkout_form.html" %}

</aside>
