<div

    x-show="cartOpen"

    x-transition

    class="fixed inset-0 z-50 bg-black/45 lg:hidden"
    role="dialog"
    aria-modal="true"
    aria-label="سلة الطلب">

    <div

        @click.outside="cartOpen=false"

        class="mobile-cart-sheet mobile-no-scroll absolute bottom-0 left-0 right-0 max-h-[92vh] overflow-y-auto rounded-t-3xl bg-white shadow-2xl">

        <div class="sticky top-0 z-10 flex items-center justify-between border-b bg-white/95 px-4 py-3 backdrop-blur sm:p-5">

            <h2 class="text-xl font-bold">
                سلة الطلب
            </h2>

            <button
                @click="cartOpen=false"
                class="touch-target rounded-full text-2xl"
                aria-label="إغلاق">
                ✕
            </button>

        </div>

        <div class="p-4 sm:p-5">

            <template
                x-if="items.length === 0">

                <div class="py-12 text-center text-slate-400">
                    <div class="mb-2 text-4xl" aria-hidden="true">🛒</div>
                    <p class="font-semibold">السلة فارغة</p>
                    <p class="mt-1 text-xs">أضف منتجات من المنيو لتبدأ طلبك</p>
                </div>

            </template>

            <template
                x-for="item in items"
                :key="item.lineId">

                <div class="mb-4 border-b pb-4">

                    <div class="flex justify-between gap-3">

                        <div class="flex-1">

                            <strong x-text="item.name"></strong>

                            <template x-if="item.options && item.options.length > 0">
                                <div class="mt-1 text-xs text-slate-500">
                                    <template x-for="opt in item.options" :key="opt.id">
                                        <div>• <span x-text="opt.name"></span> (+<span x-text="formatPrice(opt.price_adjustment)"></span>)</div>
                                    </template>
                                </div>
                            </template>

                            <template x-if="item.addons && item.addons.length > 0">
                                <div class="mt-1 text-xs text-slate-500">
                                    <template x-for="addon in item.addons" :key="addon.id">
                                        <div>+ <span x-text="addon.name"></span> (<span x-text="formatPrice(addon.price)"></span>)</div>
                                    </template>
                                </div>
                            </template>

                            <template x-if="item.item_note">
                                <div class="mt-1 text-xs text-amber-700">📝 <span x-text="item.item_note"></span></div>
                            </template>

                            <div class="mt-1 font-semibold text-primary" x-text="formatPrice(lineTotal(item))"></div>

                        </div>

                        <button
                            @click="remove(item.lineId)"
                            class="text-lg text-red-500"
                            aria-label="حذف">
                            🗑
                        </button>

                    </div>

                    <div class="mt-3 flex items-center gap-2">

                        <button
                            class="touch-target h-10 w-10 rounded-lg bg-slate-200 text-lg font-bold"
                            @click="decreaseQty(item)">
                            −
                        </button>

                        <input
                            x-model.number="item.quantity"
                            @change="setQty(item, item.quantity)"
                            type="number"
                            min="1"
                            max="999"
                            step="1"
                            class="w-16 rounded-lg border text-center py-2">

                        <button
                            class="touch-target h-10 w-10 rounded-lg bg-slate-200 text-lg font-bold"
                            @click="increaseQty(item)">
                            +
                        </button>

                    </div>

                </div>

            </template>

        </div>

        {% include "public/components/checkout_form.html" %}

    </div>

</div>
