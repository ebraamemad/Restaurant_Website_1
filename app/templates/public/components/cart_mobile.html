<div

x-show="cartOpen"

x-transition

class="fixed inset-0 z-50 bg-black/40 lg:hidden">

    <div

        @click.outside="cartOpen=false"

        class="absolute bottom-0 left-0 right-0 max-h-[90vh] overflow-auto rounded-t-3xl bg-white shadow-2xl">

        <div class="flex items-center justify-between border-b p-4 sm:p-5">

            <h2 class="text-xl font-bold">

                سلة الطلب

            </h2>

            <button

                @click="cartOpen=false"

                class="text-2xl">

                ✕

            </button>

        </div>

        <div class="p-4 sm:p-5">

            <template

                x-if="items.length==0">

                <p class="py-10 text-center">

                    السلة فارغة

                </p>

            </template>

            <template

                x-for="item in items"

                :key="item.id">

                <div class="mb-5 border-b pb-4">

                    <div class="flex justify-between gap-3">

                        <div>

                            <strong

                                x-text="item.name">

                            </strong>

                            <div class="mt-1 text-xs text-slate-500" x-show="item.qty">

                                الكمية: <span x-text="item.qty"></span>

                            </div>

                        </div>

                        <button

                            @click="remove(item.id)"

                            class="text-red-500">

                            🗑

                        </button>

                    </div>

                    <div class="mt-3 flex items-center gap-2">

                        <button

                            @click="decreaseQty(item)"

                            class="h-8 w-8 rounded bg-slate-200">

                            -

                        </button>

                        <input

                            x-model.number="item.quantity"

                            type="number"

                            step="0.25"

                            class="w-16 text-center">

                        <button

                            @click="increaseQty(item)"

                            class="h-8 w-8 rounded bg-slate-200">

                            +

                        </button>

                    </div>

                </div>

            </template>

        </div>

        {% include "public/components/checkout_form.html" %}

    </div>

</div>
