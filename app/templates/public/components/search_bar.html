<div class="mb-5 sm:mb-6" x-data="{
    q: '',
    busy: false,
    async search() {
        this.busy = true;
        try {
            const resp = await fetch('/search?q=' + encodeURIComponent(this.q));
            if (!resp.ok) return;
            document.getElementById('products').innerHTML = await resp.text();
        } finally {
            this.busy = false;
        }
    },
    async clear() {
        this.q = '';
        await this.search();
    }
}">

    <form class="card flex items-center gap-2 p-2.5 sm:p-3" @submit.prevent="search()">

        <span class="pr-2 text-lg text-slate-400" aria-hidden="true">🔍</span>

        <input
            x-model.trim="q"
            type="search"
            placeholder="ابحث عن منتج..."
            class="min-w-0 flex-1 border-none bg-transparent p-2 text-sm focus:outline-none sm:text-base">

        <button
            type="button"
            x-show="q.length > 0"
            x-cloak
            @click="clear()"
            aria-label="مسح البحث"
            class="rounded-xl px-2 py-2 text-sm font-bold text-slate-400 transition hover:bg-slate-100 hover:text-slate-600">

            مسح

        </button>

        <button
            type="submit"
            :disabled="busy"
            class="flex items-center gap-2 rounded-xl bg-primary px-5 py-2.5 text-sm font-bold text-white transition hover:bg-secondary disabled:opacity-50 sm:py-3">

            <span x-show="busy" class="inline-block h-3.5 w-3.5 animate-spin rounded-full border-2 border-white/40 border-t-white" x-cloak></span>

            بحث

        </button>

    </form>

</div>
