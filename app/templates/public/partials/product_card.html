<div class="card group overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:shadow-xl">

    {% if product.image_url %}

    <a href="/products/{{ product.slug }}">
        <img
            src="{{ product.image_url }}"
            alt="{{ product.name }}"
            class="product-image w-full transition duration-300 group-hover:scale-[1.02]"
            loading="lazy"
            decoding="async">
    </a>

    {% else %}

    <a href="/products/{{ product.slug }}">
        <div class="product-image flex items-center justify-center bg-slate-200 text-4xl font-semibold text-slate-500 sm:text-5xl">
            🍽
        </div>
    </a>

    {% endif %}

    <div class="p-2.5 sm:p-4">

        <h3 class="text-sm font-bold leading-5 sm:text-lg">

            <a href="/products/{{ product.slug }}" class="hover:text-primary">{{ product.name }}</a>

        </h3>

        {% if product.description %}

        <p class="mt-1.5 text-xs leading-5 text-slate-500 sm:text-sm line-clamp-2">

            {{ product.description }}

        </p>

        {% endif %}

        <div class="mt-3 flex items-center justify-between gap-2">

            <div>

                <p class="text-lg font-extrabold text-primary sm:text-2xl">

                    {{ product.price }}

                </p>

                <span class="text-xs text-slate-500 sm:text-sm">

                    {{ settings.currency }}{% if product.unit %} / {{ product.unit }}{% endif %}

                </span>

            </div>

            <div class="flex items-center gap-1.5 rounded-2xl border border-slate-200 bg-slate-50 px-1.5 py-1">

                <button type="button" class="h-6 w-6 rounded-full bg-white text-base shadow-sm" @click.stop="decreaseProductQty({{ product.id }})">−</button>

                <span class="min-w-5 text-center text-xs font-bold sm:text-sm" x-text="qtyMap[{{ product.id }}] || 1"></span>

                <button type="button" class="h-6 w-6 rounded-full bg-white text-base shadow-sm" @click.stop="increaseProductQty({{ product.id }})">+</button>

            </div>

        </div>

        <button

            @click='add({
                id: {{ product.id }},
                name: {{ product.name|tojson|safe }},
                price: {{ product.price }},
                quantity: qtyMap[{{ product.id }}] || 1
            })'

            class="mt-3 w-full rounded-2xl bg-primary py-2 text-xs font-bold text-white shadow-sm transition duration-200 hover:-translate-y-0.5 hover:bg-secondary sm:py-3 sm:text-base">

            ➕ أضف للسلة

        </button>

    </div>

</div>
