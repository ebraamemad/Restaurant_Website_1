<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

{% set theme = theme_colors(settings) %}
<meta name="theme-color" content="{{ theme.primary }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

<title>

{{ settings.restaurant_name if settings else "Restaurant" }}

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script>

tailwind.config={

theme:{

extend:{

fontFamily:{

cairo:["Cairo","sans-serif"]

},

colors:{

primary:"{{ theme.primary }}",

secondary:"{{ theme.secondary }}",

accent:"{{ theme.accent }}",

light:"#f8fafc"

},

boxShadow:{

card:"0 10px 30px rgba(0,0,0,.08)"

}

}

}

}

</script>

<script defer
src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

<link rel="stylesheet"
href="/static/css/app.css">

<style>
:root{
--color-primary:{{ theme.primary }};
--color-secondary:{{ theme.secondary }};
--color-accent:{{ theme.accent }};
}
</style>

</head>

<body class="min-h-screen font-cairo text-slate-800 antialiased selection:bg-primary selection:text-white"
style="background: radial-gradient(circle at top, color-mix(in srgb, {{ theme.primary }} 12%, transparent), transparent 45%), linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)">

{% block content %}

{% endblock %}

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/js/sw.js').catch(() => {});
  });
}

const isPWAInstalled = () =>
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

window.addEventListener('beforeinstallprompt', (e) => {
  if (isPWAInstalled()) return;
  e.preventDefault();
  window.deferredPrompt = e;
  const banner = document.getElementById('pwa-install-banner');
  if (banner) {
    banner.classList.remove('hidden');
    banner.classList.add('flex');
  }
});

window.addEventListener('appinstalled', () => {
  window.deferredPrompt = null;
  const banner = document.getElementById('pwa-install-banner');
  if (banner) {
    banner.classList.add('hidden');
    banner.classList.remove('flex');
  }
});

function dismissPWAInstall() {
  const banner = document.getElementById('pwa-install-banner');
  if (banner) {
    banner.classList.add('hidden');
    banner.classList.remove('flex');
  }
}

async function installPWA() {
  if (!window.deferredPrompt) return;
  window.deferredPrompt.prompt();
  const { outcome } = await window.deferredPrompt.userChoice;
  window.deferredPrompt = null;
  dismissPWAInstall();
}
</script>

<div id="pwa-install-banner" class="fixed bottom-0 left-0 right-0 z-50 hidden flex-col items-center gap-3 bg-white p-4 shadow-[0_-4px_20px_rgba(0,0,0,0.15)]" style="display:none">
  <p class="text-sm font-semibold">أضف التطبيق إلى شاشتك الرئيسية</p>
  <div class="flex gap-3">
    <button onclick="installPWA()" class="rounded-xl bg-emerald-600 px-6 py-2.5 text-sm font-bold text-white">ثبّت التطبيق</button>
    <button onclick="dismissPWAInstall()" class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-600">لاحقًا</button>
  </div>
</div>

</body>

</html>
