{% extends "public/base.html" %}
{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-6 py-16 text-center">
  <div class="flex h-20 w-20 items-center justify-center rounded-full text-4xl"
       style="background: {{ theme.primary }}1a; color: {{ theme.primary }}">
    &#10003;
  </div>
  <h1 class="mt-6 text-2xl font-bold text-slate-800">طلبك وصلنا</h1>
  <p class="mt-3 max-w-sm text-sm leading-7 text-slate-500">
    رقم طلبك <span class="font-bold text-slate-700">#{{ order_id }}</span>. هنجهزّه ونبعتلك
    عليه على رقمك المسجّل.
  </p>
  <a href="/"
     class="mt-8 inline-flex items-center gap-2 rounded-xl px-7 py-3 text-sm font-bold text-white shadow-lg transition hover:opacity-90"
     style="background: {{ theme.primary }}">
    ارجع للصفحة الرئيسية
  </a>
</div>
{% endblock %}
