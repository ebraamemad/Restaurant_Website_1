{% extends "admin/base.html" %}
{% block content %}
<h1 class="mb-5 text-2xl font-bold">طرق التوصيل والاستلام</h1>
<form method="post" class="mb-6 grid gap-3 rounded bg-white p-4 shadow-sm md:grid-cols-2">
  {{ csrf_field(request) }}
  <input name="name" required class="rounded border px-3 py-2" placeholder="الاسم (مثال: توصيل / استلام من المطعم)">
  <input name="fee" type="number" step="0.01" min="0" value="0" class="rounded border px-3 py-2" placeholder="رسوم التوصيل">
  <input name="estimated_time" class="rounded border px-3 py-2" placeholder="الوقت المتوقع (مثال: 30-45 دقيقة)">
  <input name="sort_order" type="number" value="0" class="rounded border px-3 py-2" placeholder="الترتيب">
  <textarea name="description" class="rounded border px-3 py-2 md:col-span-2" placeholder="وصف مختصر (اختياري)"></textarea>
  <label><input name="is_pickup" type="checkbox" value="true"> استلام من المطعم (بدون عنوان أو رسوم)</label>
  <label><input name="is_active" type="checkbox" value="true" checked> نشط</label>
  <button class="rounded bg-slate-900 px-4 py-2 font-bold text-white md:col-span-2">إضافة طريقة</button>
</form>
<div class="grid gap-4 md:grid-cols-2">
  {% for option in options %}
    <form method="post" class="rounded bg-white p-4 shadow-sm">
      {{ csrf_field(request) }}
      <input type="hidden" name="id" value="{{ option.id }}">
      <input name="name" value="{{ option.name }}" required class="mb-2 w-full rounded border px-3 py-2">
      <div class="mb-2 grid grid-cols-2 gap-2">
        <label class="text-sm text-slate-600">الرسوم
          <input name="fee" type="number" step="0.01" min="0" value="{{ option.fee }}" class="mt-1 w-full rounded border px-3 py-2">
        </label>
        <label class="text-sm text-slate-600">الترتيب
          <input name="sort_order" type="number" value="{{ option.sort_order }}" class="mt-1 w-full rounded border px-3 py-2">
        </label>
      </div>
      <input name="estimated_time" value="{{ option.estimated_time or '' }}" class="mb-2 w-full rounded border px-3 py-2" placeholder="الوقت المتوقع">
      <textarea name="description" class="mb-2 w-full rounded border px-3 py-2" placeholder="وصف مختصر (اختياري)">{{ option.description or "" }}</textarea>
      <div class="mb-3 flex gap-4">
        <label><input name="is_pickup" type="checkbox" value="true" {% if option.is_pickup %}checked{% endif %}> استلام من المطعم</label>
        <label><input name="is_active" type="checkbox" value="true" {% if option.is_active %}checked{% endif %}> نشط</label>
      </div>
      <button class="rounded bg-emerald-700 px-4 py-2 text-white">حفظ</button>
      <button form="delete-option-{{ option.id }}" class="rounded bg-red-600 px-4 py-2 text-white">حذف</button>
    </form>
    <form id="delete-option-{{ option.id }}" method="post" action="/admin/delivery-options/{{ option.id }}/delete">{{ csrf_field(request) }}</form>
  {% endfor %}
</div>
{% endblock %}
