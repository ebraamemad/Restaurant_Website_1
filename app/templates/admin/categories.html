{% extends "admin/base.html" %}
{% block content %}
{% if error_message %}
<div class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm font-semibold text-red-700">{{ error_message }}</div>
{% endif %}
<h1 class="mb-4 text-xl font-bold sm:text-2xl">الأقسام</h1>
<form method="post" enctype="multipart/form-data" class="mb-6 grid gap-3 rounded bg-white p-4 shadow-sm sm:grid-cols-2">
  {{ csrf_field(request) }}
  <input name="name" required class="rounded border px-3 py-2.5" placeholder="اسم القسم">
  <input name="sort_order" type="number" value="0" class="rounded border px-3 py-2.5" placeholder="الترتيب">
  <textarea name="description" class="rounded border px-3 py-2.5 md:col-span-2" placeholder="الوصف"></textarea>
  <input name="image" type="file" accept="image/*" class="rounded border px-3 py-2.5 md:col-span-2">
  <label class="flex items-center gap-2 text-sm"><input name="is_active" type="checkbox" value="true" checked> نشط</label>
  <button class="rounded bg-slate-900 px-4 py-2.5 font-bold text-white md:col-span-2">إضافة قسم</button>
</form>
<div class="grid gap-3 sm:grid-cols-2">
  {% for category in categories %}
    <form method="post" enctype="multipart/form-data" class="rounded-lg bg-white p-4 shadow-sm">
      {{ csrf_field(request) }}
      <input type="hidden" name="id" value="{{ category.id }}">
      <input name="name" value="{{ category.name }}" class="mb-2 w-full rounded-lg border px-3 py-2.5">
      <input name="sort_order" type="number" value="{{ category.sort_order }}" class="mb-2 w-full rounded-lg border px-3 py-2.5">
      <textarea name="description" class="mb-2 w-full rounded-lg border px-3 py-2.5">{{ category.description or "" }}</textarea>
      <input name="image" type="file" accept="image/*" class="mb-2 w-full rounded-lg border px-3 py-2.5">
      <div class="mb-3 flex gap-4">
        <label class="flex items-center gap-2 text-sm"><input name="is_active" type="checkbox" value="true" {% if category.is_active %}checked{% endif %}> نشط</label>
      </div>
      <button class="rounded-lg bg-emerald-700 px-4 py-2.5 text-white">حفظ</button>
      <button form="delete-category-{{ category.id }}" class="rounded-lg bg-red-600 px-4 py-2.5 text-white">حذف</button>
    </form>
    <form id="delete-category-{{ category.id }}" method="post" action="/admin/categories/{{ category.id }}/delete">{{ csrf_field(request) }}</form>
  {% endfor %}
</div>
{% endblock %}
