{% extends "admin/base.html" %}
{% block content %}
{% if error_message %}
<div class="alert alert-danger mb-4">{{ error_message }}</div>
{% endif %}

<div class="page-header">
  <div>
    <h1 class="page-title">الأقسام</h1>
    <p class="page-sub">نظّم منتجاتك في أقسام واضحة للعميل.</p>
  </div>
</div>

<form method="post" enctype="multipart/form-data" class="panel p-4 mb-6 cols" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
  {{ csrf_field(request) }}
  <div class="field-group mb-0">
    <label class="label" for="cat-name">اسم القسم</label>
    <input id="cat-name" name="name" required class="input" placeholder="اسم القسم">
  </div>
  <div class="field-group mb-0">
    <label class="label" for="cat-sort">الترتيب</label>
    <input id="cat-sort" name="sort_order" type="number" value="0" class="input" placeholder="الترتيب">
  </div>
  <div class="field-group mb-0" style="grid-column:1/-1">
    <label class="label" for="cat-desc">الوصف</label>
    <textarea id="cat-desc" name="description" class="textarea" placeholder="الوصف"></textarea>
  </div>
  <div class="field-group mb-0" style="grid-column:1/-1">
    <label class="label" for="cat-img">الصورة</label>
    <input id="cat-img" name="image" type="file" accept="image/*" class="input">
  </div>
  <label class="flex items-center gap-2 text-sm font-bold" style="color:var(--color-ink)">
    <input name="is_active" type="checkbox" value="true" checked> نشط
  </label>
  <button class="btn btn-primary" style="grid-column:1/-1">إضافة قسم</button>
</form>

<div class="cols cols-2">
  {% for category in categories %}
    <form method="post" enctype="multipart/form-data" class="panel p-4">
      {{ csrf_field(request) }}
      <input type="hidden" name="id" value="{{ category.id }}">
      <label class="label" for="cat-name-{{ category.id }}">اسم القسم</label>
      <input id="cat-name-{{ category.id }}" name="name" value="{{ category.name }}" class="input mb-3">
      <label class="label" for="cat-sort-{{ category.id }}">الترتيب</label>
      <input id="cat-sort-{{ category.id }}" name="sort_order" type="number" value="{{ category.sort_order }}" class="input mb-3">
      <label class="label" for="cat-desc-{{ category.id }}">الوصف</label>
      <textarea id="cat-desc-{{ category.id }}" name="description" class="textarea mb-3">{{ category.description or "" }}</textarea>
      <label class="label" for="cat-img-{{ category.id }}">الصورة</label>
      <input id="cat-img-{{ category.id }}" name="image" type="file" accept="image/*" class="input mb-3">
      <div class="mb-3 flex gap-4">
        <label class="flex items-center gap-2 text-sm font-bold" style="color:var(--color-ink)">
          <input name="is_active" type="checkbox" value="true" {% if category.is_active %}checked{% endif %}> نشط
        </label>
      </div>
      <div class="flex flex-wrap gap-2">
        <button class="btn btn-primary btn-sm">حفظ</button>
        <button form="delete-category-{{ category.id }}" class="btn btn-danger btn-sm">حذف</button>
      </div>
    </form>
    <form id="delete-category-{{ category.id }}" method="post" action="/admin/categories/{{ category.id }}/delete">{{ csrf_field(request) }}</form>
  {% endfor %}
</div>
{% endblock %}
