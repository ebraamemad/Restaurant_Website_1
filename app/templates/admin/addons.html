{% extends "admin/base.html" %}
{% block content %}
<h1 class="mb-5 text-2xl font-bold">إضافات "{{ product.name }}"</h1>

<form method="post" action="/admin/products/{{ product.id }}/addons" class="mb-6 grid gap-3 rounded bg-white p-4 shadow-sm md:grid-cols-4">
  {{ csrf_field(request) }}
  <input name="name" required class="rounded border px-3 py-2 md:col-span-2" placeholder="اسم الإضافة">
  <input name="price" type="number" step="0.01" min="0" required class="rounded border px-3 py-2" placeholder="السعر">
  <input name="sort_order" type="number" value="0" class="rounded border px-3 py-2" placeholder="الترتيب">
  <label class="flex items-center gap-2"><input name="is_active" type="checkbox" value="true" checked> نشط</label>
  <button class="rounded bg-slate-900 px-4 py-2 font-bold text-white md:col-span-4">إضافة إضافة</button>
</form>

<div class="space-y-3">
  {% for addon in addons %}
    <form method="post" action="/admin/products/{{ product.id }}/addons" class="grid gap-3 rounded bg-white p-4 shadow-sm md:grid-cols-4">
      {{ csrf_field(request) }}
      <input type="hidden" name="id" value="{{ addon.id }}">
      <input name="name" value="{{ addon.name }}" required class="rounded border px-3 py-2 md:col-span-2" placeholder="اسم الإضافة">
      <input name="price" type="number" step="0.01" min="0" value="{{ addon.price }}" required class="rounded border px-3 py-2" placeholder="السعر">
      <input name="sort_order" type="number" value="{{ addon.sort_order }}" class="rounded border px-3 py-2" placeholder="الترتيب">
      <label class="flex items-center gap-2"><input name="is_active" type="checkbox" value="true" {% if addon.is_active %}checked{% endif %}> نشط</label>
      <button class="rounded bg-emerald-700 px-4 py-2 text-white md:col-span-4">حفظ</button>
      <button form="delete-addon-{{ addon.id }}" class="rounded bg-red-600 px-4 py-2 text-white md:col-span-4">حذف</button>
    </form>
    <form id="delete-addon-{{ addon.id }}" method="post" action="/admin/products/{{ product.id }}/addons/{{ addon.id }}/delete">{{ csrf_field(request) }}</form>
  {% else %}
    <p class="text-sm text-slate-500">لا توجد إضافات بعد لهذا المنتج.</p>
  {% endfor %}
</div>

<div class="mt-4">
  <a href="/admin/products" class="text-sm text-slate-600 hover:text-primary">← العودة للمنتجات</a>
</div>
{% endblock %}
