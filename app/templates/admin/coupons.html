{% extends "admin/base.html" %}
{% block content %}
<h1 class="mb-5 text-2xl font-bold">الكوبونات</h1>
<form method="post" class="mb-6 grid gap-3 rounded bg-white p-4 shadow-sm md:grid-cols-2">
  {{ csrf_field(request) }}
  <input name="code" required class="rounded border px-3 py-2" placeholder="كود الكوبون (مثال: SAVE10)">
  <select name="discount_type" required class="rounded border px-3 py-2">
    <option value="percentage">نسبة مئوية %</option>
    <option value="fixed">مبلغ ثابت</option>
  </select>
  <input name="discount_value" type="number" step="0.01" min="0.01" required class="rounded border px-3 py-2" placeholder="قيمة الخصم">
  <input name="minimum_order" type="number" step="0.01" min="0" value="0" class="rounded border px-3 py-2" placeholder="الحد الأدنى للطلب">
  <label class="text-sm text-slate-600">يبدأ من
    <input name="start_date" type="datetime-local" required class="mt-1 w-full rounded border px-3 py-2">
  </label>
  <label class="text-sm text-slate-600">ينتهي في
    <input name="end_date" type="datetime-local" required class="mt-1 w-full rounded border px-3 py-2">
  </label>
  <input name="usage_limit" type="number" min="1" class="rounded border px-3 py-2" placeholder="حد الاستخدامات (فاضي = غير محدود)">
  <label><input name="is_active" type="checkbox" value="true" checked> نشط</label>
  <button class="rounded bg-slate-900 px-4 py-2 font-bold text-white md:col-span-2">إضافة كوبون</button>
</form>
<div class="grid gap-4 md:grid-cols-2">
  {% for coupon in coupons %}
    <form method="post" class="rounded bg-white p-4 shadow-sm">
      {{ csrf_field(request) }}
      <input type="hidden" name="id" value="{{ coupon.id }}">
      <div class="mb-2 flex items-center justify-between">
        <span class="rounded bg-slate-100 px-2 py-1 text-xs font-bold">{{ status_of(coupon, now) }}</span>
        <span class="text-xs text-slate-500">الاستخدام: {{ coupon.usage_count }}/{{ coupon.usage_limit or "∞" }}</span>
      </div>
      <input name="code" value="{{ coupon.code }}" required class="mb-2 w-full rounded border px-3 py-2 font-mono" placeholder="الكود">
      <select name="discount_type" class="mb-2 w-full rounded border px-3 py-2">
        <option value="percentage" {% if coupon.discount_type == "percentage" %}selected{% endif %}>نسبة مئوية %</option>
        <option value="fixed" {% if coupon.discount_type == "fixed" %}selected{% endif %}>مبلغ ثابت</option>
      </select>
      <div class="mb-2 grid grid-cols-2 gap-2">
        <label class="text-sm text-slate-600">قيمة الخصم
          <input name="discount_value" type="number" step="0.01" min="0.01" value="{{ coupon.discount_value }}" required class="mt-1 w-full rounded border px-3 py-2">
        </label>
        <label class="text-sm text-slate-600">الحد الأدنى
          <input name="minimum_order" type="number" step="0.01" min="0" value="{{ coupon.minimum_order }}" class="mt-1 w-full rounded border px-3 py-2">
        </label>
      </div>
      <div class="mb-2 grid grid-cols-2 gap-2">
        <label class="text-sm text-slate-600">يبدأ من
          <input name="start_date" type="datetime-local" value="{{ coupon.start_date.strftime('%Y-%m-%dT%H:%M') }}" required class="mt-1 w-full rounded border px-3 py-2">
        </label>
        <label class="text-sm text-slate-600">ينتهي في
          <input name="end_date" type="datetime-local" value="{{ coupon.end_date.strftime('%Y-%m-%dT%H:%M') }}" required class="mt-1 w-full rounded border px-3 py-2">
        </label>
      </div>
      <label class="mb-2 block text-sm text-slate-600">حد الاستخدامات
        <input name="usage_limit" type="number" min="1" value="{{ coupon.usage_limit or '' }}" class="mt-1 w-full rounded border px-3 py-2" placeholder="فاضي = غير محدود">
      </label>
      <label class="mb-3 block"><input name="is_active" type="checkbox" value="true" {% if coupon.is_active %}checked{% endif %}> نشط</label>
      <button class="rounded bg-emerald-700 px-4 py-2 text-white">حفظ</button>
      <button form="delete-coupon-{{ coupon.id }}" class="rounded bg-red-600 px-4 py-2 text-white">حذف</button>
    </form>
    <form id="delete-coupon-{{ coupon.id }}" method="post" action="/admin/coupons/{{ coupon.id }}/delete">{{ csrf_field(request) }}</form>
  {% endfor %}
</div>
{% endblock %}
