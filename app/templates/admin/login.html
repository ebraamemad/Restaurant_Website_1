<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid min-h-screen place-items-center bg-slate-100">
  <form method="post" class="w-full max-w-sm rounded bg-white p-6 shadow-sm">
    <h1 class="mb-5 text-2xl font-bold">دخول الأدمن</h1>
    {% if error %}<p class="mb-3 rounded bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>{% endif %}
    <input name="username" required class="mb-3 w-full rounded border px-3 py-2" placeholder="اسم المستخدم">
    <input name="password" type="password" required class="mb-4 w-full rounded border px-3 py-2" placeholder="كلمة المرور">
    <button class="w-full rounded bg-slate-900 px-4 py-2 font-bold text-white">دخول</button>
  </form>
</body>
</html>
