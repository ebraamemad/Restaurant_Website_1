{% extends "admin/base.html" %}
{% block content %}
<h1 class="mb-5 text-2xl font-bold">المنتجات</h1>
<form method="post" enctype="multipart/form-data" class="mb-6 grid gap-3 rounded bg-white p-4 shadow-sm md:grid-cols-2">
  <select name="category_id" required class="rounded border px-3 py-2">
    {% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}
  </select>
  <input name="name" required class="rounded border px-3 py-2" placeholder="اسم المنتج">
  <input name="price" type="number" step="0.01" min="0.01" required class="rounded border px-3 py-2" placeholder="السعر">
  <input name="unit" value="kg" class="rounded border px-3 py-2" placeholder="الوحدة">
  <input name="sort_order" type="number" value="0" class="rounded border px-3 py-2" placeholder="الترتيب">
  <input name="image" type="file" accept="image/*" class="rounded border px-3 py-2">
  <textarea name="description" class="rounded border px-3 py-2 md:col-span-2" placeholder="الوصف"></textarea>
  <label><input name="is_available" type="checkbox" value="true" checked> متوفر</label>
  <label><input name="is_active" type="checkbox" value="true" checked> ظاهر</label>
  <button class="rounded bg-slate-900 px-4 py-2 font-bold text-white md:col-span-2">إضافة منتج</button>
</form>

<div class="space-y-4">
  {% for product in products %}
    <form method="post" enctype="multipart/form-data" class="grid gap-3 rounded bg-white p-4 shadow-sm md:grid-cols-6">
      <input type="hidden" name="id" value="{{ product.id }}">
      <select name="category_id" class="rounded border px-3 py-2">
        {% for category in categories %}<option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}
      </select>
      <input name="name" value="{{ product.name }}" class="rounded border px-3 py-2">
      <input name="price" type="number" step="0.01" min="0.01" value="{{ product.price }}" class="rounded border px-3 py-2">
      <input name="unit" value="{{ product.unit }}" class="rounded border px-3 py-2">
      <input name="sort_order" type="number" value="{{ product.sort_order }}" class="rounded border px-3 py-2">
      <input name="image" type="file" accept="image/*" class="rounded border px-3 py-2">
      <textarea name="description" class="rounded border px-3 py-2 md:col-span-6">{{ product.description or "" }}</textarea>
      <label><input name="is_available" type="checkbox" value="true" {% if product.is_available %}checked{% endif %}> متوفر</label>
      <label><input name="is_active" type="checkbox" value="true" {% if product.is_active %}checked{% endif %}> ظاهر</label>
      <button class="rounded bg-emerald-700 px-4 py-2 text-white">حفظ</button>
      <button form="delete-product-{{ product.id }}" class="rounded bg-red-600 px-4 py-2 text-white">حذف</button>
    </form>
    <form id="delete-product-{{ product.id }}" method="post" action="/admin/products/{{ product.id }}/delete"></form>
  {% endfor %}
</div>
{% endblock %}
