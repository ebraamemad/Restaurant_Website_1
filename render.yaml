services:
  - type: web
    name: restaurant-system
    env: python
    plan: free
    region: oregon

    buildCommand: pip install -r requirements.txt

    startCommand: sh -c "python -m alembic upgrade head && python -m app.seed_admin && gunicorn -k uvicorn.workers.UvicornWorker --forwarded-allow-ips='*' --bind 0.0.0.0:8000 app.main:app"

    healthCheckPath: /ready

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: APP_SECRET_KEY
        sync: false

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      - key: APP_ENV
        value: production

      - key: COOKIE_SECURE
        value: true

      - key: LOG_FORMAT
        # json عشان Render يجمّع السطور بشكل صحيح
        value: json

      - key: LOG_LEVEL
        value: INFO